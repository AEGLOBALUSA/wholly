from = "/manifest.json"
to = "/manifest.json"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/sw.js"
to = "/sw.js"
status = 200.0
force = false

[redirects.query]

