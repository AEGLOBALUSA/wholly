<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
    }

    /* Full-bleed hero photo */
    .hero-photo {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }

    /* Same warm overlay as the live site */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(90, 50, 30, 0.45), rgba(120, 60, 40, 0.35));
      z-index: 1;
    }

    /* Centered content — matches the live hero exactly */
    .content {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 80px;
    }

    .logo {
      font-family: 'Sora', sans-serif;
      font-size: 80px;
      font-weight: 800;
      letter-spacing: 10px;
      text-transform: uppercase;
      color: #FFFFFF;
      line-height: 1;
      margin-bottom: 16px;
    }

    .subtitle {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #B8A99A;
      margin-bottom: 28px;
    }

    .description {
      font-family: 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.92);
      max-width: 560px;
      margin-bottom: 36px;
    }

    /* CTA button matching the site's gradient pill */
    .cta {
      display: inline-block;
      padding: 16px 44px;
      border-radius: 25px;
      background: linear-gradient(135deg, #D4727A, #B8A99A);
      color: #FFFFFF;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(212, 114, 122, 0.3), 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .notice {
      margin-top: 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="og-card">
    <!-- Full-bleed couple photo — same as the live carousel -->
    <div class="hero-photo">
      <img src="https://raw.githubusercontent.com/AEGLOBALUSA/wholly/main/assets/carousel/couple-1.jpg" alt="">
    </div>

    <!-- Warm cinematic overlay — exact same as the live site -->
    <div class="overlay"></div>

    <!-- Centered hero content — mirrors the live homepage -->
    <div class="content">
      <div class="logo">WHOLLY</div>
      <div class="subtitle">Spirit. Soul. Body. Matched.</div>
      <div class="description">
        You know what you're looking for.<br>
        So should they.<br>
        This is for people who've stopped settling for surface.
      </div>
      <div class="cta">JOIN NOW</div>
      <div class="notice">Free during launch &mdash; No card required</div>
    </div>
  </div>
</body>
</html>
