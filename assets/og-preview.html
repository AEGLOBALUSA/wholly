<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Sora:wght@200;300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background: #0E0A08;
    }

    /* Full-bleed couple photo — right side focus */
    .hero-photo {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
      filter: brightness(0.6) contrast(1.1) saturate(0.8);
    }

    /* Warm golden color grade — luxury hotel feel */
    .color-grade {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background:
        linear-gradient(135deg, rgba(30, 18, 8, 0.85) 0%, rgba(30, 18, 8, 0.4) 55%, rgba(30, 18, 8, 0.2) 100%),
        linear-gradient(180deg, rgba(180, 140, 80, 0.08) 0%, rgba(0, 0, 0, 0.1) 100%);
      mix-blend-mode: normal;
    }

    /* Subtle golden light leak from right */
    .light-leak {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse at 85% 40%, rgba(200, 165, 100, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(180, 140, 80, 0.06) 0%, transparent 40%);
    }

    /* Subtle sparkle particles */
    .sparkle {
      position: absolute;
      z-index: 3;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(210, 185, 140, 0.5);
      box-shadow: 0 0 8px rgba(210, 185, 140, 0.3);
    }
    .sparkle-1 { top: 180px; right: 220px; width: 3px; height: 3px; }
    .sparkle-2 { top: 340px; right: 160px; width: 2px; height: 2px; opacity: 0.6; }
    .sparkle-3 { top: 120px; right: 380px; width: 2px; height: 2px; opacity: 0.4; }
    .sparkle-4 { top: 420px; right: 300px; width: 3px; height: 3px; opacity: 0.5; }
    .sparkle-5 { top: 260px; right: 100px; width: 2px; height: 2px; opacity: 0.3; }

    /* Content — left-aligned, editorial */
    .content {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
      max-width: 680px;
    }

    /* Brand */
    /* Giant brand name */
    .brand-name {
      font-family: 'Sora', sans-serif;
      font-size: 120px;
      font-weight: 800;
      letter-spacing: 14px;
      text-transform: uppercase;
      color: #FFFFFF;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
    }

    /* Headline beneath */
    .headline {
      margin-bottom: 24px;
    }

    .headline-accent {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 400;
      font-style: italic;
      line-height: 1.3;
      background: linear-gradient(135deg, #D4B896, #C9A96E, #E8D5B5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subline */
    .subline {
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.7);
      max-width: 460px;
      margin-bottom: 32px;
    }

    /* Bottom tag */
    .bottom-tag {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-radius: 24px;
      background: rgba(201, 169, 110, 0.1);
      border: 1px solid rgba(201, 169, 110, 0.2);
      align-self: flex-start;
    }

    .bottom-tag-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #C9A96E;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Thin gold line at very top */
    .gold-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #C9A96E 0%, rgba(201, 169, 110, 0.2) 100%);
      z-index: 20;
    }

    /* Small decorative diamond — bottom right like the reference */
    .diamond {
      position: absolute;
      bottom: 36px;
      right: 56px;
      z-index: 10;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(201, 169, 110, 0.35);
      transform: rotate(45deg);
    }

    .diamond-inner {
      position: absolute;
      bottom: 40px;
      right: 60px;
      z-index: 10;
      width: 6px;
      height: 6px;
      background: rgba(201, 169, 110, 0.4);
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div class="og-card">
    <!-- Full-bleed couple photo -->
    <div class="hero-photo">
      <img src="https://raw.githubusercontent.com/AEGLOBALUSA/wholly/main/assets/carousel/couple-5.jpg" alt="">
    </div>

    <!-- Golden color grade overlay -->
    <div class="color-grade"></div>
    <div class="light-leak"></div>

    <!-- Subtle sparkles -->
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>
    <div class="sparkle sparkle-4"></div>
    <div class="sparkle sparkle-5"></div>

    <!-- Gold accent -->
    <div class="gold-line"></div>

    <!-- Content -->
    <div class="content">
      <div class="brand-name">WHOLLY</div>

      <div class="headline">
        <div class="headline-accent">Know someone before you see them.</div>
      </div>

      <div class="subline">
        Faith-first matchmaking. 52 questions.<br>
        4 dimensions. Meet someone wholly you.
      </div>

      <div class="bottom-tag">
        <span class="bottom-tag-text">Faith-First Matchmaking</span>
      </div>
    </div>

    <!-- Decorative diamond -->
    <div class="diamond"></div>
    <div class="diamond-inner"></div>
  </div>
</body>
</html>
