<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
    }

    /* Full-bleed hero photo */
    .hero-photo {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    /* Cinematic gradient overlay — dark bottom for text, warm tones */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(180deg,
          rgba(0, 0, 0, 0.05) 0%,
          rgba(0, 0, 0, 0.0) 25%,
          rgba(0, 0, 0, 0.15) 50%,
          rgba(20, 12, 15, 0.7) 75%,
          rgba(20, 12, 15, 0.92) 100%
        ),
        linear-gradient(135deg,
          rgba(212, 114, 122, 0.1) 0%,
          transparent 50%
        );
      z-index: 1;
    }

    /* Top gold accent line */
    .accent-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #D4727A 0%, #C9A96E 40%, #D4727A 100%);
      z-index: 10;
    }

    /* Top bar — brand + tagline */
    .top-bar {
      position: absolute;
      top: 28px;
      left: 56px;
      right: 56px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 10px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }

    .top-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .top-badge-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Bottom content */
    .bottom-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 0 56px 44px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .bottom-left {
      max-width: 700px;
    }

    .headline {
      font-family: 'Sora', sans-serif;
      font-size: 56px;
      font-weight: 800;
      line-height: 1.05;
      color: #FFFFFF;
      margin-bottom: 14px;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .headline .accent {
      background: linear-gradient(135deg, #E8A5AB, #C9A96E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 300;
      font-style: italic;
    }

    .sub-headline {
      font-family: 'DM Sans', sans-serif;
      font-size: 19px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
      max-width: 520px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Bottom right — features */
    .bottom-right {
      display: flex;
      gap: 10px;
      flex-direction: column;
      align-items: flex-end;
    }

    .feature-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .pill-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .pill-icon-coral {
      background: rgba(212, 114, 122, 0.25);
      color: #E8A5AB;
    }

    .pill-icon-gold {
      background: rgba(201, 169, 110, 0.25);
      color: #C9A96E;
    }

    .pill-icon-green {
      background: rgba(76, 175, 125, 0.2);
      color: #5CC98E;
    }

    .pill-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.5px;
    }

    /* URL watermark */
    .url {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Sora', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
      display: none; /* hidden — URL shows in the meta tag instead */
    }
  </style>
</head>
<body>
  <div class="og-card">
    <!-- Full-bleed couple photo -->
    <div class="hero-photo">
      <img src="carousel/couple-1.jpg" alt="">
    </div>

    <!-- Cinematic overlay -->
    <div class="overlay"></div>

    <!-- Gold accent line -->
    <div class="accent-line"></div>

    <!-- Top bar -->
    <div class="top-bar">
      <div class="logo">WHOLLY</div>
      <div class="top-badge">
        <span class="top-badge-text">Beta &mdash; Now Live</span>
      </div>
    </div>

    <!-- Bottom content -->
    <div class="bottom-content">
      <div class="bottom-left">
        <div class="headline">
          Where Faith Meets<br><span class="accent">Forever</span>
        </div>
        <div class="sub-headline">
          Premium matchmaking for Spirit-filled Christians.<br>
          52 questions. 4 dimensions. One covenant.
        </div>
      </div>

      <div class="bottom-right">
        <div class="feature-pill">
          <div class="pill-icon pill-icon-coral">&#10023;</div>
          <span class="pill-text">4-Layer Compatibility</span>
        </div>
        <div class="feature-pill">
          <div class="pill-icon pill-icon-gold">&#10003;</div>
          <span class="pill-text">Pastor Verified</span>
        </div>
        <div class="feature-pill">
          <div class="pill-icon pill-icon-green">&#9829;</div>
          <span class="pill-text">Substance Before Selfies</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
